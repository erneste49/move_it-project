<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical operators : if - else if - else </title>
</head>
<body>
    

    <script>
    // if a user is above 18 and have an id he is allowed to enter an area else, he is adviced to go home
        let age = 20;
        let hasId = true; 
        if ( (age  > 18) && ( hasId == true ) ){
            console.log("You are allowed to Enter");   
        } else{
            console.log("You are adviced to go Home");    
        }

    // a university admission has the following policy; to be admitted a student needs to score above 200 in utme and above 70 in putme if a student does not meet the above, he must be from a catchment area. Write a program to determine if a student will be admitted or not. 

    // 3 conditions (score above 200 utme, score above 70, from catch)
    // 2 action to perform (admitted or not)
    let utme = 290;
    let putme= 10;
    let catchmentArea = false;
    if ( ((utme > 200) && (putme > 70)) || (catchmentArea = true) ){
        console.log("You are Admitted");
    }else{
        console.log("You are not Admitted");
    }

    //Another example
    let amountSpent = 100000;
    let isPremiumMember = false;

    if ( amountSpent >= 100000 ){
        let discount = (20/100) * amountSpent; //calculating discount of 20% for spending of 100k and above
        console.log(`You receive a discount of 20% which is ${discount} `);
    }else if ( (amountSpent >= 50000 ) || (isPremiumMember == true)) {
        let discount = (10/100) * amountSpent;
        console.log(`You receive a discount of 10% which is ${discount} `);
    }else{
        console.log(`You do not Qualify for any discount`);
        
    }

    </script>
</body>
</html>
