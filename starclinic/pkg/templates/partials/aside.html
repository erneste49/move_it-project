<aside class="sidebar">
    <div class="logo">
        <i class="bi bi-heart-pulse-fill"></i>
        <span>Star Clinic</span>
    </div>

    <nav class="nav">
        <a class="active" href="{{ url_for('dashboard') }}">
            <i class="bi bi-grid"></i> Dashboard
        </a>

        <a href="{{ url_for('doctors') }}">
            <i class="bi bi-person-badge"></i> Doctors
        </a>

        {% if session.get('role') == 'admin' %}
            <a href="{{ url_for('admin') }}#specialties">
                <i class="bi bi-heart-pulse"></i> Specialties
            </a>
            <a href="{{ url_for('admin') }}#patients">
                <i class="bi bi-people"></i> Patients
            </a>
            <a href="{{ url_for('admin') }}#appointments">
                <i class="bi bi-calendar-check"></i> Appointments
            </a>
        {% elif session.get('role') == 'patient' %}
            <a href="{{ url_for('user') }}#appointments">
                <i class="bi bi-calendar-plus"></i> Book Appointment
            </a>
            <a href="{{ url_for('user') }}#history">
                <i class="bi bi-calendar-check"></i> My Appointments
            </a>
        {% elif session.get('role') == 'doctor' %}
            <a href="{{ url_for('doctor_dashboard') }}#appointments">
                <i class="bi bi-calendar-check"></i> My Appointments
            </a>
            <a href="{{ url_for('doctor_dashboard') }}#patients">
                <i class="bi bi-people"></i> Patients
            </a>
        {% endif %}

        <!-- Logout is POST because it changes authentication state. -->
        <form action="{{ url_for('logout') }}" method="POST" class="logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="nav-button">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </nav>
</aside>
