<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}"> 
</head>
<body>

    <div>
     

        <a href="{{ url_for('posts.create') }}"> Create Post </a> |  
        <form class="logout" action="{{url_for('users.logout')}}" method="POST">
            <button> Logout </button>
        </form>  <br>

        <h1>Posts Homepage </h1>
        <h2> Posts </h2>    
        {%for post in posts%}
            <div class="post">
                <small> Posted at <strong>{{ post.created_at }} </strong> </small>
                <h3> {{post.title}} </h3> 
                {% if post.image %}
                    <img src='/static/uploads/{{post.image}}' alt=""  '> 
                {%else%}

                {%endif%}
                <p> {{post.content}} </p>     
            </div>
        {%endfor%}
    </div>
    
</body>
</html>
