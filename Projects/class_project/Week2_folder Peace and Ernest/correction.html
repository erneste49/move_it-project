<!DOCTYPE html>
<html>
	<head>
		<title> TEENS Hub </title>
		<meta charset="UTF-8" />
		<meta name="description" content="This website is about teens hub containing information about the site and ceo pictures" />
		<meta name="viewport" content="width=device-width; initial-scale=1.0 " />
		
		<meta name="author" content="peace and ernest" >
		
		<link rel="stylesheet" href="">
		<style> 
			*{
				margin:0px;
				padding:0px;
			}
			.grid-container{
				height: 100vh;
				display:grid;
				grid-template-columns: 1/7;
				grid-template-rows: 1/9 ;
				gap:10px;
			}
			.header{
				grid-column: 1/7;
				height:80px;
				background-color:black;
			}
			.banner{
				grid-column: 1/7;
				height:400px;
				background-color: yellow;
			}
			.headline1{
				grid-column:1/7;
				height: 100px;
				background-color: green;
				
			}
			.image1{
				grid-column:2/4 ;
				height: 300px; 
				background-color:blue;
			}
			.content1{
				grid-column:4/6;
				height:300px;
				background-color:purple;
			}
			.content2{
				grid-column:2/4;
				height:300px;
				background-color:purple;
			}
			.image2{
				grid-column:4/6 ;
				height: 300px; 
				background-color:blue;
			}
			.headline2{
				grid-column:1/7;
				height: 100px;
				background-color: green;
			}
			.person1{
				grid-colums:2/3;
				height: 300px;
				background-color: gray;
			}
			.person2{
				grid-colums:3/4;
				height: 300px;
				background-color: gray;
			}
			.person3{
				grid-colums:4/5;
				height: 300px;
				background-color: gray;
			}
			.person4{
				grid-colums:5/6;
				height: 300px;
				background-color: gray;
			}
			.footer{
				grid-column:1/7;
				height:500px;
				background-color: red;
			}
			
			@media screen and (max-width:640px) {
				.image1{
					grid-column:1/7;
				}
				.content1{
					grid-column:1/7;
				}
				.image2{
					grid-column:1/7;
				}
				.content2{
					grid-column:1/7;
				}
				.person1{
					grid-column: 1/7;
				}
				.person2{
					grid-column: 1/7;
				}
				.person3{
					grid-column: 1/7;
				}
				.person4{
					grid-column: 1/7;
				}
			}
			
			
			
		</style>
	</head>
	<body> 
	<!-- start of main container -->
	<div class="grid-container">
		<div class="header">  </div>
		<div class="banner"> </div>
		<div class="headline1"> </div>
		<div class="image1"> </div>
		<div class="content1"> </div>
		<div class="content2"> </div>
		<div class="image2"> </div>
		<div class="headline2"> </div>
		<div class="person1"> </div>
		<div class="person2"> </div>
		<div class="person3"> </div>
		<div class="person4"> </div>
		<div class="footer"> </div>
		
	
	<!-- end of main container -->
	</div>
	</body>
</html>
