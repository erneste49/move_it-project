<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Specialty | Star Clinic</title>
    <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
</head>
<body>
    <main class="form-page">
        <section class="panel form-panel">
            <div class="section-title">
                <h1>Edit Specialty</h1>
                <a class="btn btn-light" href="{{ url_for('admin') }}#specialties">Back</a>
            </div>

            <form method="POST" action="{{ url_for('edit_specialty', specialty_id=specialty.id) }}" class="form-grid">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label>Specialty Name
                    <input type="text" name="name" value="{{ specialty.name }}" required>
                </label>

                <label>Description
                    <textarea name="description" rows="4">{{ specialty.description }}</textarea>
                </label>

                <div class="form-action full-width">
                    <button class="btn" type="submit">Save Specialty</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
