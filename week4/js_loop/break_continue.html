    <title> Break and Continue in js </title>

<body>
    

    <script>

        // break | continue
        // creating a loop that goes from 1 to 10
        function normalLoop ( ){
            for ( let k = 1; k <= 10; k++){
                console.log(k); 
            }
        }
        //normalLoop()

         function normalBreak ( ){
            for ( let k = 1; k <= 10; k++){
               // console.log(k);
                
                //using break, to stop at a number divisible by 5
                if ( k % 5 == 0 ){
                    break
                }
                console.log(k);
                
            }
        }
       // normalBreak( );

       function loopContinue ( ){
            for ( let k = 1; k <= 10; k++){
               // console.log(k);
                
                //using continue, will skip current iteration if number divisible by 3
                if ( k % 3 == 0 ){
                    continue;
                }
                console.log(k);
                
            }
        }
        // loopContinue(  );

        function skipNumber ( ){
            for ( let k = 1; k <= 20; k++){
                if ( k % 2 == 0) {
                    continue;
                }
                if (k % 15 == 0){
                    continue
                }
                
                console.log(k);
            }
        }
       // skipNumber (  )
        //another way to perform it
         function printOdd ( ){
            for ( let k = 1; k <= 20; k++){
                if ( k % 2 == 0 || k == 15) {
                    continue;
                }
            }
         }
       //  printOdd( )
