<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Clinic | Register</title>
    <link href="{{ url_for('static', filename='css/signup.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-wrap">
        <div class="auth-brand">
            <i class="bi bi-heart-pulse-fill"></i>
            <h1>Star Clinic</h1>
            <p>Create your patient account</p>
            <span>Public registration creates a Patient account. Doctors and administrators are created by an administrator.</span>
        </div>

        <div class="auth-form">
            <a class="back" href="{{ url_for('index') }}">&larr; Back to home</a>
            <h2>Create account</h2>
            <p class="muted">Enter your details to register as a patient.</p>

            <form method="POST" action="{{ url_for('signup') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="two">
                    <label>First Name
                        <input type="text" name="first_name" value="{{ first_name }}">
                        {% if errors.get('first_name') %}<p class="field-error">{{ errors['first_name'] }}</p>{% endif %}
                    </label>
                    <label>Last Name
                        <input type="text" name="last_name" value="{{ last_name }}">
                        {% if errors.get('last_name') %}<p class="field-error">{{ errors['last_name'] }}</p>{% endif %}
                    </label>
                </div>

                <label>Email Address
                    <input type="email" name="email" value="{{ email }}" placeholder="Enter your email">
                    {% if errors.get('email') %}<p class="field-error">{{ errors['email'] }}</p>{% endif %}
                </label>

                <label>Phone Number
                    <input type="tel" name="phone" value="{{ phone }}" placeholder="Enter phone number">
                    {% if errors.get('phone') %}<p class="field-error">{{ errors['phone'] }}</p>{% endif %}
                </label>

                <label>Password
                    <input type="password" name="password" placeholder="At least 8 characters">
                    {% if errors.get('password') %}<p class="field-error">{{ errors['password'] }}</p>{% endif %}
                </label>

                <label>Confirm Password
                    <input type="password" name="confirm_password" placeholder="Retype password">
                    {% if errors.get('confirm_password') %}<p class="field-error">{{ errors['confirm_password'] }}</p>{% endif %}
                </label>

                <button class="btn auth-submit" type="submit">Create Patient Account</button>
            </form>

            <p class="center muted">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        </div>
    </div>
</body>
</html>
