<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Decisions if - else if - else </title>
</head>
<body>
    

    <script>
// Based on a user's marital status, display  a message    
// --- " if - else if - else" -----
        let maritalStatus = "single";

        if ( maritalStatus == "single" ){
            console.log("Look before you leap");
        } else if ( maritalStatus == "married"){
            console.log("Love youe spouse");
        }else if( maritalStatus == "divorced" ){
            console.log("Well you can try again"); 
        } else if( maritalStatus == "widowed" ){
            console.log("it is not the end");
        }else{
            console.log("sorry ohh");
        }
    

    </script>
</body>
</html>
