<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show and Hide Password</title>
</head>
<body>
    
  <!--- <input type="text" id="username" name="username" placeholder="Enter your username"> <br>    ---> 
    <input type="password" id="password" name="password" placeholder="enter password"> 
    <label for="showHide" id="lab"</label>
    <input type="checkbox" id="showHide" name="showHide"> 
    <br>
    <button>Submit</button>



    <script>
        let password = document.getElementById('password');
        let showAndHide = document.getElementById('showHide');
        let label = document.getElementById('lab');

        showAndHide.addEventListener('change', function(){
            //checkbox have an attribute called checked
            //checkbox : checked;
            console.log(this.checked);
            
            if (this.checked){
                password.type = "text"
                label.textContent = 'hide'
            }else{
                password.type = "password"
                label.textContent = 'show'
            }
        })

    </script>

</body>
</html>
