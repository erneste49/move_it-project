<!DOCTYPE>
<html>
	<head>
		<title> Flexbox	Layout	</title>
	</head>

	<body >
			<!-- Main container -->
			<div style="border:2px solid blue; min-height:200px;  ">	
					
					<!--- section 1 --->
					<div style="border: 2px solid red; min-height:200px; display:flex;">
							<div style="border:2px green solid; min-height:100px; background-color:brown; width:50%;">	</div>

							<div style="border:2px red solid; min-height:100px; background-color:pink; width:50%;  ">		</div>
					</div>	

					<!--- section 2 --->
					<div style="border:2px solid green; min-height:200px; display:flex;">
						<div style="border:4px solid green; min-height:200px; width:30%; background-color:green; "> </div>
						<div style="border:4px solid white; min-height:200px; width:40%; background-color:white; "> </div>
						<div style="border:4px solid green; min-height:200px; width:30%; background-color:green; "> </div>
					</div>


					<!-- section 3 --->
					<div style="border:5px solid black; min-height:200px; background-color:pink;">	
					
					</div>

			</div>
	</body>




</html>
