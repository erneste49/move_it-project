<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {%block title %} MoveIt - Homepage {% endblock %} </title>
     <script src="https://cdn.tailwindcss.com"></script> <!--tailwind css -->
     <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" /> <!-- flowbite css -->
     <link rel="stylesheet" href="{{ url_for('static' , filename='css/styles.css') }}" >
     {% block style %}

     {%endblock%}

 
</head>
<body class="bg-violet-50">
<div>

    <!-- Navbar -->
    <div class="navbar">
        <nav class="bg-violet-50 text-orange-500 fixed z-50 w-full z-20 top-0 start-0 border-b border-default">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
        <a href="{{url_for('home.home_page')}}" class="flex items-center space-x-3 rtl:space-x-reverse">
            <img src="{{ url_for('static', filename='images/moveit-logo.png') }}" alt="MoveIt logo" class="h-10 w-auto">
        </a>
        <div class="inline-flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
           {% block actiontodo %}
            <form method="" action="{{url_for('home.register_user')}}" class="signup bg-orange-400 text-white border font-bold border-white hover:bg-white hover:text-orange-500 px-3 py-2 ">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button> Sign up </button>
            </form>
            {% endblock %}
            <button data-collapse-toggle="navbar-cta" type="button" class="inline-flex items-center p-2 w-9 h-9 justify-center text-sm text-body rounded-base md:hidden  hover:bg-neutral-secondary-soft hover:text-heading focus:outline-none focus:ring-2 focus:ring-neutral-tertiary" aria-controls="navbar-cta" aria-expanded="false">
                <span class="sr-only">Open main menu</span>
                <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14"/></svg>
            </button>
        </div>
        <div class="items-center justify-between bg-white md:bg-transparent hidden w-full md:flex md:w-auto md:order-1" id="navbar-cta">
            {% block navlinks %}
            <ul class="font-medium flex flex-col p-4 md:p-0 mt-4 border border-default rounded-base bg-neutral-secondary-soft md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-neutral-primary">
            <li>
                <a href="{{url_for('home.home_page')}}" class="block py-2 px-3 text-sky-950 md:text-xl md:font-bold hover:text-orange-500 hover:border  hover:px-3 hover:py-2 bg-brand rounded md:bg-transparent md:text-fg-brand md:p-0" aria-current="page">Home</a>
            </li>
            <li>
                <a href="{{url_for('home.relocate')}}" class="block py-2 px-3 text-sky-950 md:text-xl md:font-bold hover:text-orange-500  hover:border  hover:px-3 hover:py-2 text-heading rounded   md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Relocate</a>
            </li>
            <li>
                <a href="{{url_for('home.shop')}}" class="block py-2 px-3 text-sky-950 md:text-xl md:font-bold  hover:text-orange-500 hover:border  hover:px-3 hover:py-2 text-heading rounded md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Shop Now</a>
            </li>
            <li>
                <a href=" {{url_for('user.home')}} " class="block py-2 px-3 text-sky-950 md:text-xl md:font-bold  hover:text-orange-500 hover:border  hover:px-3 hover:py-2 text-heading rounded   md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Sell Items</a>
            </li>
            </ul>
            {% endblock %}
        </div>
        </div>
        </nav>
    </div>

    {% block maincontent %}
        
    {% endblock %}

    <!--footer-->
    <div class="footer bg-sky-950  text-white">
        <footer class=" rounded-base shadow-xs  m-4">
            <div class="w-full mx-auto max-w-screen-xl p-4 text-center">
            <span class="text-sm text-body sm:text-center">© 2026 <a href="{{url_for('home.home_page')}}" class="hover:underline">MoveIt</a>. All Rights Reserved. Developed by nstech.
            </span>

            </div>
        </footer>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
{%block jsscript%}

{%endblock%}

</body>
</html>
