<!doctype html>
<html>
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title> Tailwind Layout </title>
    <style>
      div{
        border:1px solid red;
        min-height: 100px;
      }
    </style>
  </head>
  <body>
   
    <div class="max-w-screen-xl  mx-auto  "> 
      <!-- flex -->
      <!-- justify-center , justify-around , justify-between -->
        <div class="flex justify-center gap-4 flex-wrap py-4 ">
          <div class="grow bg-red-200"> </div>
          <div class="grow bg-red-300"> </div>
          <div class="grow bg-red-500"> </div>
        </div>

        <div class="flex justify-center gap-3 flex-wrap-reverse py-5 ">
          <div class="grow bg-lime-200 "> </div>
          <div class="grow bg-lime-300 "> </div>
          <div class="grow bg-lime-500"> </div>
          <div class="grow bg-sky-200"> </div>
          <div class="grow bg-sky-300"> </div>
          <div class="grow bg-sky-500"> </div>
        </div>


        <!-- grid -->
        <!-- using grid to arrange element in two column = grid-cols-2 -->
        <div class="grid grid-cols-2 p-5 gap-5">
          <div class="bg-rose-500"></div>
          <div class="bg-sky-600"></div>
          <div class="bg-lime-700"></div>
          <div class="bg-sky-400"></div>
          <div class="bg-sky-600 col-span-2"></div>
        </div>

        <!-- framework -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3  p-5 gap-5">
            <div class=" bg-fuchsia-600"></div>
            <div class="bg-indigo-600"></div>
            <div class="bg-slate-600"></div>
            <div class="bg-red-500"></div>
            <div class="bg-yellow-500 "></div>
             <div class="bg-sky-600"></div>
          <div class="bg-lime-700"></div>
          <div class="bg-sky-400"></div>
          </div>


    </div>
   

  </body>
</html>
