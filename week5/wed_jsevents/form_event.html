<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Event</title>

    <style>
        .text-warning{
            background-color: red;
            color:white;
            width: 50%;
        }
        .text-success{
            background-color: blue;
            color: white;
            width: 50%;
        }
    </style>
</head>
<body>

    <div id="response"> </div>
    <form action="submitted.html" method="get" id="loginForm">

        <input type="email" name="email" id="email" placeholder="Enter your email">
        <input type="password" name="password" id="password" placeholder="Enter password">
        <button>Login</button>
    </form>

    <script>
        let responseTag = document.getElementById('response');
        let logform = document.getElementById('loginForm');
        let emailField = document.getElementById('email');
        let passwordfield = document.getElementById('password')
        logform.addEventListener('submit', function(event){
            event.preventDefault(); //stopping browser fromm performing action
            //below line to clear the responsetag feedback
            responseTag.innerHTML = ''
        // alert('You submitted form');
        //Validation:  below line to stop browser from submiting form if email and password field is empty
           let password = passwordfield.value;
           let email = emailField.value;
           //Checking if the form value are empty 
           if ( password == "" || email == "" ){
                let pTag = document.createElement('p');
                pTag.textContent = " All field are reqired";
                pTag.className = 'text-warning'  // or -- pTag.classList.add('text-warning')
                responseTag.appendChild(pTag);
              //  event.preventDefault();
           }else {
             let pTag = document.createElement('p');
                pTag.textContent = " Form Submitted";
                pTag.className = 'text-success'  
                responseTag.appendChild(pTag);
           }
            
        })


    </script>
    
</body>
</html>
