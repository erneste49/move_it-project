<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch statement</title>
</head>
<body>
    

    <script>

        let favDay = "friday";
        switch (favDay) {
            case "Monday":
                console.log("You love work");
                break;
            case "friday": 
                console.log("You love the weekend");
                break;
            case "sunday":
                console.log("You love to rest");
                break;
            default:
                console.log("You are living one day at a time");
        }

    </script>
</body>
</html>
