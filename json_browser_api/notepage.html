<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepage</title>
    <style>
        .display_note{
            background-color: rgb(177, 231, 231);
            padding: 5px;
            color: rgb(6, 6, 56);
        }
    </style>
</head>
<body>

    <h1> Note page</h1> <br><br>
    <a href="index.html">Create note</a> <br><br>

    <div id="specialnotes">

    </div>


    <script>
        //retrieve special note stored in local storage

        document.addEventListener("DOMContentLoaded", function(){
            //retrieve special note from local storage
            let n_notes = localStorage.getItem("special_note") ? localStorage.getItem("special_note") : "";
            let noteTag = document.createElement("p");
            noteTag.classList.add("display_note")
            if (n_notes == ""){
                noteTag.innerHTML = "<span style='color:white; background-color:red; padding:20px'> You have not saved any special note </span>";
            }else{
                noteTag.textContent = n_notes;
                let delBtn = document.createElement("button")
                delBtn.textContent = "Delete Note"
                delBtn.addEventListener("click", function(){
                    localStorage.removeItem("special_note");
                    alert("note removed")
                })
                document.getElementById("specialnotes").append(delBtn)
            }

            document.getElementById("specialnotes").append(noteTag)

        })


    </script>
    
</body>
</html>
