<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Birthday Party </title>
    <style>
       
        form input{
            margin: 10px;
            padding: 20px;
            border: 1px solid gold;
            text-align: center;
            border-width: 40%;
        }
        button{
            padding: 10px;
            width: 120px;
            background-color: black;
            color: white;
            
        }
        .container{
            margin: -9px;
            background-color: khaki;
            text-align: center;
            display: grid;
            grid-template-columns: repeat(3, 1fr) ;
            grid-template-rows: 700px;
            justify-content: center;
        }
        .first{
            grid-column: 1/2;
            height: 100vh;
            width: 33%;
        }
        .welcome{
            grid-column: 2/3;
            height: 100vh;
           
        }
        .third{
            grid-column: 3/4;
            height: 100vh;
            width: 33%;
        }
        img{
          width: 480px;
          height: 60vh;
            padding: 10px;
        }
        .heading{
            text-align: center;
            background-color: black;
            color: white;
            padding: 1px;
            margin: -7px;
        }
        .footer{
             text-align: center;
            background-color: black;
            color: khaki;
            padding: 1px;
            margin: -7px;
        }
        }
    </style>
</head>
<body>
    <div class="heading"> <h1> Welcome to my Birthday event page </h1>
    <h3>Please conplete the form below if you are attending the party </h3></div>
    <!--Start of maincontainer -->
    <div class="container">
        <!--Start of first div container -->
      <div class="first"><img src="images/bday.jpg" alt=""> </div>
      <!--end of first div container-->    

      <!--Start of middle div container -->
        <div class="welcome">
           
        <form action="" method="">
            <input type="text" name="" placeholder="Enter your fullName"> <br><br>
            <input type="text" name="" placeholder=" Enter your Phone number"> <br><br>
            <input type="email" name="" placeholder="Enter your email"> <br>
            <label> Gender: </label> <br>
                <input type="radio" name="Gender" value="Male"  > <span>Male </span> <br>
                <input type="radio" name="Gender" value="Female" > <span>Female</span> <br>
            <input type="text" name="" placeholder="Enter your state of residence"> <br><br>
            <label style="font-family:arial;"> Choose Birthday Gift : </label> <br>
                <input type="checkbox" name="gift" value="Car" > <label> Car </label> <br>
                <input type="checkbox" name="gift" value="Blender" > <label> Blender </label> <br>
                <input type="checkbox" name="gift" value="Shoe" > <label> Shoe </label> <br>
                <input type="checkbox" name="gift" value="Cloth" > <label> Cloth </label> <br>
                <input type="checkbox" name="gift" value="Cash" > <label> Cash </label> <br>

            
            <button> Submit </button> <br><br>
        </form>
        </div>
        <!--end of middle div container-->

        <!--Start of third div container-->
      <div class="third"><img src="images/hbd.jpg" alt=""> </div> 
        <!--end of  div container-->
    </div>
    <!--end of maincontainer div -->
    <div class="footer"><h3>You are all invited to my birthday celebration</h3>
    <p>May we all have reasons to celebrate every year </p>
    <p>Courtsey- celebrant & Family members </p>
    </div>
    
</body>
</html>
