
{% extends "partials/master.html" %}

{% block title %}
Registration page
{%endblock%}

{% block actiontodo %}  {% endblock %}

{% block style %}
 <script src="https://cdn.tailwindcss.com"></script> <!--tailwind css -->
<link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" /> <!-- flowbit css -->
<link rel="stylesheet" href="{{ url_for('user.static' , filename='css/style.css') }}" >
{% endblock %}

{% block maincontent%}
<div class="register-container">
    <!--register section -->
  <main class="p-6 md:p-12 flex flex-col md:flex-row items-center">
    <div class="max-w-md w-full mx-auto">

      <div class="bg-white rounded-3xl shadow-sm border p-7 md:p-9 mt-8">
        <div class="flex bg-slate-100 p-1 rounded-xl mb-7">
          <a href="{{url_for('home.login')}}" id="loginTab" class="flex-1 py-2.5 text-center rounded-lg text-slate-500 ">Login</a>
          <a href="{{url_for('home.register_user')}}" id="registerTab" class="flex-1 py-2.5 text-center rounded-lg bg-white font-bold ">Register</a>
        </div>
        
        <div id="registerForm" class="phidden">
          <h2 class="text-3xl font-black">Create an account</h2>
         
            <form method="POST" action="{{url_for('home.register_user')}}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <label class="block mt-6 text-sm font-bold">First name</label>
              <input id="name" class="w-full mt-2 p-3 rounded-xl border" name="first_name" placeholder="Enter your first name">

              <label class="block mt-6 text-sm font-bold">Last name</label>
              <input id="name" class="w-full mt-2 p-3 rounded-xl border" name="last_name" placeholder="Enter your last name">

              <label class="block mt-4 text-sm font-bold">Email</label>
              <input id="regEmail" type="email" class="w-full mt-2 p-3 rounded-xl border" name="email" placeholder="you@example.com">

              <label class="block mt-6 text-sm font-bold">Phone Number </label>
              <input id="phone" class="w-full mt-2 p-3 rounded-xl border" name="phone" placeholder="Phone Number ">

              <div class="location-select-fields">
              <label class="block mt-6 text-sm font-bold" for="state">State of residence</label>
              <select id="state" name="state" data-lga-url="{{ url_for('home.get_lga', state_id=0) }}" class="state-select w-full mt-2 p-3 rounded-xl border" required>
                <option value="">Select state</option>
                {% for state in states %}
                <option value="{{state.state_id}}" >{{ state.state_name }}</option>
                {% endfor %}
              </select> 
              
              <label class="block mt-6 text-sm font-bold" for="local_government">Local government</label>
              <select name="lga" id="local_government" class="lga-select w-full mt-2 p-3 rounded-xl border" required disabled>
                <option value="">Select state first</option>
              </select> 
              </div>

              <label class="block mt-6 text-sm font-bold">Address, Closest landmark</label>
              <input id="landmark" class="w-full mt-2 p-3 rounded-xl border" name="address" placeholder="Address">

              <label class="block mt-4 text-sm font-bold">Password</label>
              <input id="regPassword" type="password" class="w-full mt-2 p-3 rounded-xl border" name="password" placeholder="Create a password">

              <label class="block mt-4 text-sm font-bold">Confirm Password</label>
              <input id="regPassword" type="password" class="w-full mt-2 p-3 rounded-xl border" name="confirm_pwd" placeholder="Create a password">
            

              <button class="w-full mt-6 bg-orange-500 text-white py-3 rounded-xl font-bold"> Create account </button>
          </form>
          <p id="regMsg" class="text-sm mt-4 text-center"> </p>

          <p class="text-sm mt-4 text-center">Already have an account? <a href="{{url_for('home.login')}}" class="font-bold text-sky-500">Login</a></p>
        </div>
      </div>
    </div>
  </main>

</div>
{% endblock %}

{%block jsscript%}
<script src="{{ url_for('static', filename='js/script.js' ) }}">  </script>
{%endblock%}
