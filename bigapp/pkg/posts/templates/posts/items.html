<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}"> 
</head>
<body>

     <div >
      
        <form class="logout" action="{{url_for('users.logout')}}" method="POST">
            <button> Logout </button>
        </form>  <br>

        <h1>Items Homepage </h1>
        <h2> Items </h2>    
        <div class="items">
             {%for item in items %}
            <div class="item">
              <h2>Item Name: {{ item.name }}</h2>
              <p>Item Price: {{ item.price }} </p>
              <p>Item Description: {{ item.description }}</p>
              <small> Created At: {{ item.created_at }}</small>
              <br><br>
                <form method="post" action="{{url_for('posts.pay_initialize', item_id=item.id)}}">
                    <button> Buy Now </button>    
                </form>
            </div>

        {%endfor%}
        </div>
       
    </div>
    
</body>
</html>
