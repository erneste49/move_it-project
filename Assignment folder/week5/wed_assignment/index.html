<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ernest Assignment </title>

    <style>
        #container{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            width: 100%;
            height: 300px;
            border: 1px solid red;
        }
       

    </style>
</head>
<body>
    
    <div id="container">
        
    <form action="" method="get" id="todoForm">
        <input type="text" id="todoItem" name="item" placeholder="Enter a task">
        <button> Add Task </button>
    </form>

    <ul id="todoList">   
        
    </ul>


    </div>
     
       


    <script>
        //created an array to collect the inputted todo list
        let toDos = [];
        //getting the id and assigning them to a variable
        let form = document.getElementById('todoForm');
        let todo = document.getElementById('todoItem');
        let lists = document.getElementById('todoList');

        //listening for an event
        form.addEventListener('submit', function(event){
            event.preventDefault();

            let task = todo.value;
            toDos.push(task);
          
            lists.innerHTML = ''
             
            //looping over to display new todo task 
            toDos.forEach(function(task, index){
                let listItem = document.createElement('li');
                listItem.textContent = task; 

                let btn = document.createElement('button');
                btn.id = 'deletebtn';
                btn.textContent = 'Delete'  
                btn.addEventListener("click", function(index){
                    this.remove(toDos)
                })
                //appending the todo list and delete button to the div in dom
               lists.appendChild(listItem);
               lists.appendChild(btn);
                
            })
            
        
            
        })



    </script>
</body>
</html>
