<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ernest2 assignment</title>

    <style>
        body{
            background-color: ghostwhite;
        }
        ul {
            padding: 20px 20px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1> My Contact List </h1>

    <ul id="contactInfo">  </ul>


    <script>

         const myContacts = [
            { name: "Peace Smith",   relationship: "Friend",  phone: "08031234567" },
            { name: "Lateef Suleiman", relationship: "Classmate", phone: "08124567890" },
            { name: "Gabriel Rufai",  relationship: "Colleage",  phone: "07052345678" },
            { name: "Janet Richard", relationship: "Friend",phone: "09013456789" },
            {  name: "Joy Edward", relationship: "Friend", phone: "07033412789" },
            { name: "Isiah Timothy", relationship: "Friend",  phone: "08102435562" }  
            ];

            
          let divTag = document.getElementById("contactInfo");
          
            myContacts.forEach(function(infos){
             let contactName = document.createElement('p');
             contactName.textContent = infos.name;
             let contactStatus = document.createElement('p');
             contactStatus.textContent = infos.relationship;
             let contactNum = document.createElement('p');
             contactNum.textContent = infos.phone;
             
            divTag.append(contactName);
            divTag.append(contactStatus);
            divTag.append(contactNum);
            })  

           
           
            

        
        




    </script>
    
</body>
</html>
