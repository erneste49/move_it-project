<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor | Star Clinic</title>
    <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
</head>
<body>
    <main class="form-page">
        <section class="panel form-panel">
            <div class="section-title">
                <h1>Edit Doctor</h1>
                <a class="btn btn-light" href="{{ url_for('admin') }}#doctors">Back</a>
            </div>

            <form method="POST" action="{{ url_for('update_doctor', doctor_id=doctor.id) }}" class="form-grid">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label>First Name
                    <input type="text" name="first_name" value="{{ doctor.first_name }}" required>
                </label>

                <label>Last Name
                    <input type="text" name="last_name" value="{{ doctor.last_name }}" required>
                </label>

                <label>Email
                    <input type="email" name="email" value="{{ doctor.email }}" required>
                </label>

                <label>Phone
                    <input type="text" name="phone" value="{{ doctor.phone }}" required>
                </label>

                <label>Specialty
                    <select name="specialty_id" required>
                        {% for specialty in specialties %}
                            <option value="{{ specialty.id }}" {% if specialty.id == doctor.specialty_id %}selected{% endif %}>
                                {{ specialty.name }}
                            </option>
                        {% endfor %}
                    </select>
                </label>

                <label>Availability
                    <input type="text" name="availability" value="{{ doctor.availability }}" required>
                </label>

                <label>Licence Number
                    <input type="text" name="licence_number" value="{{ doctor.licence_number }}" required>
                </label>

                <label>New Password (optional)
                    <input type="password" name="password" placeholder="Leave blank to keep current password">
                </label>

                <div class="form-action full-width">
                    <button class="btn" type="submit">Update Doctor</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
