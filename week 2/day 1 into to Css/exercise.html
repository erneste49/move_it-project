<!DOCTYPE html>
<html>
	<head>
		<title> Class Exercise </title> 
		<meta charset="UTF-8" />
		<meta name="description" content="This is a Fintech Website that enables smooth financial transactions" />
		<meta name="viewport" content="width=device-width; initial-scale=1.0 " />
		<meta name="robot" content="index, follow" >
		<meta name="author" content="roi ernest" >
		
		<style>
			/* styles for html  */
			
			img{
				width:30%;
				height:30%;
			}
			
			.list1{
				color:blue;
				border:1px solid black;
				background-color:orange;
				
			}
			p{
				color:red;
			}
			
			.edit1{
				background-color:yellow;
			}
			/* To target a tag selector and a class name */
			h1.edit1{
				background-color:gray;
				
			}
			#list2{
				background-color:red;
				width:35%;
			}
			h1 span{
				color:ghostwhite;
				background-color:green;
			}
			ul.list1 li span.edit1 {
			font-size:50px;
			}
			h1,p {
				text-align:center;
			}
			#prem{
				background-color:ghostwhite;
				color:orange;
			}
			#color{
			background-color:rgb(255,205,100);
			border:1px solid red;
			min-height:100px;
			}
			
		
			
		</style>
	</head>
	<body>
	
		<div>
			<h1 class="edit1"> Profile and <span> List of Followed clubs </span></h1>
			<p class="list1"> Welcome to your profile </p>
			<p class="list1"> Below are the List of <span class="edit1">Clubs </span> you follow </p>
			<p id="prem"> Premier League </p>
			<p> La-liga League </p>
			<img src="images/pic1.jpg">
			
			<ul class="list1"> 
				<li> <span class="edit1"> Manchester United </span> </li>
				<li>  Arsenal <span> and chelsea </span> </li>
				<li> Liverpool </li>
			</ul>
			
			<ul id="list2"> 
				<li><span class="edit1"> Real Madrid </span> </li>
				<li class="list1"> Barcelona </li>
				<li> Real Betis </li>
			</ul>
			<p> Who will win the league </p>
		
		
		</div>
		
		<div id="color">
		
		</div>

	
		


	</body>
 </html>
