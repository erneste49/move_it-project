<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js sync </title>
</head>
<body>
    

    <script>
        //synchronous : runs application one line after the other 
        // console.log(1);
        // console.log(2);
        // console.log(3);
        

        //asynchronous : 
        console.log(1);
        //using callback to handle an operation that takes time
        setTimeout(function(){
            console.log(2);
            
        }, 500)

        console.log(3);
        console.log(4);
        console.log(5);
        
        
        

    </script>
</body>
</html>
