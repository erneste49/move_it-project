<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini E-Commerce</title>
<style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
  body { margin: 0; padding: 20px; background: #f5f5f5; }
  h1, h2 { text-align: center; }
  .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  
  /* Products */
  .products, .cart { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .products { flex: 2; min-width: 300px; }
  .cart { flex: 1; min-width: 300px; position: sticky; top: 20px; height: fit-content; }
  
  .product-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
  .product-card button { padding: 8px 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
  .product-card button:hover { background: #218838; }
  
  /* Cart */
  .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
  .qty-controls { display: flex; align-items: center; gap: 5px; }
  .qty-controls button { width: 25px; height: 25px; border: none; background: #007bff; color: white; border-radius: 3px; cursor: pointer; }
  .remove-btn { background: #dc3545 !important; }
  .total { font-weight: bold; font-size: 18px; margin-top: 15px; text-align: right; }
</style>
</head>
<body>

<h1>Mini E-Commerce Store</h1>
<div class="container">
  
  <!-- PRODUCTS SECTION -->
  <div class="products">
    <h2>Products</h2>
    <div id="productList"></div>
  </div>

  <!-- CART SECTION -->
  <div class="cart">
    <h2>Shopping Cart</h2>
    <div id="cartList">Your cart is empty</div>
    <div class="total" id="cartTotal">Total: $0.00</div>
  </div>

</div>

<script>
  // 1. ARRAY OF PRODUCTS
  const products = [
    { id: 1, name: "Laptop", price: 999.99 },
    { id: 2, name: "Headphones", price: 199.99 },
    { id: 3, name: "Mouse", price: 49.99 },
    { id: 4, name: "Keyboard", price: 89.99 },
    { id: 5, name: "Monitor", price: 299.99 }
  ];

  let cart = []; // shopping cart array

  const productList = document.getElementById("productList");
  const cartList = document.getElementById("cartList");
  const cartTotal = document.getElementById("cartTotal");

  // 2. DISPLAY PRODUCTS
  function displayProducts() {
    productList.innerHTML = "";
    products.forEach(product => {
      const div = document.createElement("div");
      div.className = "product-card";
      div.innerHTML = `
        <div>
          <h3>${product.name}</h3>
          <p>$${product.price.toFixed(2)}</p>
        </div>
        <button onclick="addToCart(${product.id})">Add to Cart</button>
      `;
      productList.appendChild(div);
    });
  }

  // 3. ADD TO CART - increase qty if exists
  function addToCart(id) {
    const product = products.find(p => p.id === id);
    const cartItem = cart.find(item => item.id === id);
    
    if (cartItem) {
      cartItem.quantity++; // increase quantity
    } else {
      cart.push({ ...product, quantity: 1 }); // add new
    }
    displayCart();
  }

  // 4. REMOVE PRODUCT COMPLETELY
  function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    displayCart();
  }

  // 5. INCREASE / DECREASE QUANTITY
  function updateQuantity(id, change) {
    const cartItem = cart.find(item => item.id === id);
    if (cartItem) {
      cartItem.quantity += change;
      if (cartItem.quantity <= 0) {
        removeFromCart(id); // remove if 0
      }
    }
    displayCart();
  }

  // 6. DISPLAY CART + CALCULATE SUBTOTAL + TOTAL
  function displayCart() {
    if (cart.length === 0) {
      cartList.innerHTML = "Your cart is empty";
      cartTotal.textContent = "Total: $0.00";
      return;
    }

    cartList.innerHTML = "";
    let total = 0;

    cart.forEach(item => {
      const subtotal = item.price * item.quantity; // price * quantity
      total += subtotal;

      const div = document.createElement("div");
      div.className = "cart-item";
      div.innerHTML = `
        <div>
          <p><strong>${item.name}</strong></p>
          <p>$${item.price.toFixed(2)} x ${item.quantity} = $${subtotal.toFixed(2)}</p>
        </div>
        <div class="qty-controls">
          <button onclick="updateQuantity(${item.id}, -1)">-</button>
          <span>${item.quantity}</span>
          <button onclick="updateQuantity(${item.id}, 1)">+</button>
          <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
        </div>
      `;
      cartList.appendChild(div);
    });

    cartTotal.textContent = `Total: $${total.toFixed(2)}`;
  }

  // Initialize
  displayProducts();
  displayCart();
</script>

</body>
</html>
