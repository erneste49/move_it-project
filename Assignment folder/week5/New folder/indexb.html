<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ernest Assignment </title>

    <style>
        #container{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            width: 100%;
            height: 300px;
            border: 1px solid red;
        }
       

    </style>
</head>
<body>
    
    <div id="container">
        
    <form action="" method="get" id="todoForm">
        <input type="text" id="todoItem" name="item" placeholder="Enter a task">
        <button> Add Task </button>
    </form>

    <ul id="todoList">     </ul>


    </div>
     
       


    <script>
        let toDos = [];

        let form = document.getElementById('todoForm');
        let todo = document.getElementById('todoItem');
        let lists = document.getElementById('todoList');

        form.addEventListener('submit', function(event){
            event.preventDefault();

            let task = todo.value;
            toDos.push(task);

        //    console.log(toDos);
          
            lists.innerHTML = ''
             
            toDos.forEach(function(too, index){
                let listItem = document.createElement('li');
                listItem.textContent = too; 

                let btn = document.createElement('button')
                btn.textContent = 'Delete'  
               lists.appendChild(listItem);
                
            })
            
        
            
        })

</body>
</html>
