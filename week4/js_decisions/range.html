<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Range - BMI calculator </title>
</head>
<body>
    

    <script>
    // Body mass calculator
    let bmi = 20.9;
    if ( bmi < 18.5 ){
        console.log("Underweight");
    }else if( (bmi >= 18.5) && ( bmi <=24.9 )){
        console.log("Normal weight")
    }else if( (bmi >= 25) && (bmi <= 29.9 )){
        console.log("Over weight");
    }else{
        console.log(`Obese`);   
    }



    //Class - Gift
    let tempt = -2;
    if ( tempt < 0 ){
        console.log("Extreme cold Warning");
    }else if ( (tempt >= 0) && (tempt <= 15) ){
        console.log("Cold Weather");
    }else if ( (tempt >= 16) && (tempt <=30) ){
        console.log("Normal Weather"); 
    }else if( (tempt >= 31) && (tempt <= 39) ) {
        console.log("Hot Weather"); 
    }else{
        console.log("Heat Wave alert");
    }

    </script>
</body>
</html>
