<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js Event</title>

    <style>
        a{
            text-decoration: none;
        }
        nav{
            display: flex;
            justify-content: space-between;
            padding: 20px 10%;
            background-color: cadetblue;
            color: white;
            align-items: center;
            box-shadow: rgba(0,0,0,0.24) 0px 3px 8px;
        }
        nav ul {
            display: flex;
            list-style-type: none;
            gap: 20px;
        }
        .logo{
            color: white;
            font-size: 1.5em;
            font-weight: 900;
        }
        nav ul li a{
            color: white;
            font-size: 1.2em;
            font-weight: 600;
        }
        
        .ham{
            display: none;
        }

        @media screen and (max-width: 750px ){
            nav{
                flex-wrap: wrap;
            }
            nav ul{
                width: 100%;
                flex-direction: column;
                margin-top: 30px;
                border-top: 1px solid white;
                padding-top: 20px;
            }
             .ham{
            background-color: transparent;
            border: none;
            display: block;
            background-color: transparent;
            width: 40%;
        }
        .logo{
            width: 40%;
        }
        .ham .bar {
            height: 2px;
            width: 30%;
            margin: auto;
            background-color: white;
            display: block;
            margin-bottom: 5px;
        }
        .hide_navbar{
            display: none;
        }

        }

    </style>
</head>
<body>
    <nav>
        <a href="#" class="logo"> Chopchop </a>
        <button class="ham">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <ul class="hide_navbar">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">FAQ</a></li>
        </ul>
    </nav>

    <h1>Javascript Event </h1>
    <h4 >Working with javascript Event</h4>

    <p id="firstP"> </p>
    <button id="clicky"> Click Me to create P </button>



    <script>

        //listening to click event on button with id of clicky

        //selecting element
        let clicky = document.getElementById('clicky');
        let firstParagraph = document.getElementById('firstP');
        
        //calling method addEventListener ()
        clicky.addEventListener('click', function(){
         //   alert('You Clicked the Button')
         firstParagraph.textContent = "This is the first paragraph that displays after Clicking the Button"
        });

        let ham = document.querySelector('.ham');
        let navbar = document.querySelector('nav ul');
        //on click ham should toogle

        //if ham is clicked, check if navbar has a class of hide_bar, if it has it, remove the class but if it does not change the ham bar, hide one of them and make the other to slant on top of each other using css translate 
        ham.addEventListener('click', function(){
            navbar.classList.toggle('hide_navbar');

        })

    </script>
    
</body>
</html>
