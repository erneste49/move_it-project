<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Event</title>

    <style>
        *{
            margin: 10px;
            padding: 10px;
        }
        .text-warning{
            background-color: red;
            color:white;
            width: 50%;
        }
        .text-success{
            background-color: blue;
            color: white;
            width: 50%;
        }
    </style>
</head>
<body>

    <div id="response"> </div>
    <form action="submitted.html" method="get" id="loginForm">

        <input type="email" name="email" id="email" placeholder="Enter your email">
        <input type="password" name="password" id="password" placeholder="Enter password">
        <input type="text" id="username" name="username" placeholder="Enter  your username">
        <button>Login</button>
    </form>

    <script>
        let errors = [];

        let responseTag = document.getElementById('response');
        let logform = document.getElementById('loginForm');
        let emailField = document.getElementById('email');
        let passwordfield = document.getElementById('password');
        let usernamefield = document.getElementById('username')
        logform.addEventListener('submit', function(event){
            event.preventDefault(); //stopping browser fromm performing action
            //below line to clear the responsetag feedback
            responseTag.innerHTML = ''
        // alert('You submitted form');
        //Validation:  below line to stop browser from submiting form if email and password field is empty
           let password = passwordfield.value;
           let email = emailField.value;
           let username = usernamefield.value;
          // console.log({password, email, username});
           
           //Checking if the form value are empty 
          if( username == "" ){
                errors.push('Username is required')
          }
          if (email == ""){
                errors.push('email is required')
          }
          //how to check if a string contains another string
          if (!email.includes('@')){
            errors.push('email is invalid')
          }
          if(password == ""){
            errors.push('Password is Required')
          }
          if(password.length < 8){
            errors.push('Password must be more than eight character')
          }

          //check if length of array > zero and call function to loop over errors (array object) and append it to responseDiv
          if (errors.length > 0){
            responseTag.innerHTML = ""
            errors.forEach(function(err){
                let errorContainer = document.createElement('div');
                let pErr = document.createElement('p');
                pErr.textContent = err;
                errorContainer.appendChild(pErr)
                responseTag.appendChild(errorContainer);
            });

          } else {
            let pSuccess = document.createElement("p");
            pSuccess.className = "text-success";
            pSuccess.textContent = "Form Successfully Submitted";
            responseTag.appendChild(pSuccess);
          }

            
        })


    </script>
    
</body>
</html>
