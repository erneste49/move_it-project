<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Doctor | Star Clinic</title>
    <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
</head>
<body>
    <main class="form-page">
        <section class="panel form-panel">
            <div class="section-title">
                <h1>Add Doctor</h1>
                <a class="btn btn-light" href="{{ url_for('admin') }}#doctors">Back to Dashboard</a>
            </div>

            <!-- This POST form is CSRF protected by Flask-WTF. -->
            <form method="POST" action="{{ url_for('add_doctor') }}" class="form-grid">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label>First Name
                    <input type="text" name="first_name" required>
                </label>

                <label>Last Name
                    <input type="text" name="last_name" required>
                </label>

                <label>Email
                    <input type="email" name="email" required>
                </label>

                <label>Phone
                    <input type="text" name="phone" required>
                </label>

                <label>Specialty
                    <select name="specialty_id" required>
                        <option value="">Select specialty</option>
                        {% for specialty in specialties %}
                            <option value="{{ specialty.id }}">{{ specialty.name }}</option>
                        {% endfor %}
                    </select>
                </label>

                <label>Availability
                    <input type="text" name="availability" placeholder="Monday - Friday" required>
                </label>

                <label>Licence Number
                    <input type="text" name="licence_number" required>
                </label>

                <label>Password
                    <input type="password" name="password" required>
                </label>

                <label>Confirm Password
                    <input type="password" name="confirm_password" required>
                </label>

                <div class="form-action full-width">
                    <button class="btn" type="submit">Create Doctor Account</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
