{% extends "partials/master.html" %}

{% block title %}Edit product{% endblock %}

{% block maincontent %}
<main class="mx-auto mt-24 max-w-3xl px-4 py-10">
    <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <h1 class="text-2xl font-extrabold text-sky-950">Edit product</h1>
        <form action="{{ url_for('user.edit_item', item_id=product.id) }}" method="post" class="mt-6 space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="name" class="mb-2 block text-sm font-semibold text-slate-800">Product name</label>
                <input type="text" id="name" name="name" value="{{ product.name }}" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm">
            </div>

            <div>
                <label for="description" class="mb-2 block text-sm font-semibold text-slate-800">Description</label>
                <textarea id="description" name="description" rows="4" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm">{{ product.description }}</textarea>
            </div>

            <div class="grid gap-5 sm:grid-cols-2">
                <div>
                    <label for="price" class="mb-2 block text-sm font-semibold text-slate-800">Price (₦)</label>
                    <input type="number" id="price" name="price" min="0" step="0.01" value="{{ product.price }}" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm">
                </div>
                <div>
                    <label for="category_id" class="mb-2 block text-sm font-semibold text-slate-800">Category</label>
                    <select id="category_id" name="category_id" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm">
                        {% for category in categories %}
                        <option value="{{ category.id }}" {% if category.id == product.category_id %}selected{% endif %}>{{ category.category }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="state_id" class="mb-2 block text-sm font-semibold text-slate-800">State</label>
                    <select id="state_id" name="state_id" data-lga-url="{{ url_for('home.get_lga', state_id=0) }}" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm">
                        {% for state in states %}
                        <option value="{{ state.state_id }}" {% if state.state_id == product.state_id %}selected{% endif %}>{{ state.state_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="lga_id" class="mb-2 block text-sm font-semibold text-slate-800">Local government area</label>
                    <select id="lga_id" name="lga_id" data-selected-lga="{{ product.lga_id }}" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm">
                        <option value="{{ product.lga_id }}">{{ product.lga.lga_name }}</option>
                    </select>
                </div>
                <div>
                    <label for="condition" class="mb-2 block text-sm font-semibold text-slate-800">Condition</label>
                    <select id="condition" name="condition" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm">
                        {% for value, label in [('like_new', 'Like new'), ('fairly_used', 'Fairly used'), ('good', 'Good'), ('scratched', 'Scratched'), ('broken', 'Broken')] %}
                        <option value="{{ value }}" {% if value == product.condition %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="flex flex-wrap gap-3">
                <button type="submit" class="rounded-lg bg-orange-500 px-5 py-3 font-semibold text-white hover:bg-orange-600">Save changes</button>
                <a href="{{ url_for('user.home') }}" class="rounded-lg border border-slate-300 px-5 py-3 font-semibold text-slate-700 hover:bg-slate-100">Cancel</a>
            </div>
        </form>
    </section>
</main>
{% endblock %}

{%block jsscript%}
<script src="{{ url_for('static', filename='js/script.js' ) }}">  </script>
{%endblock%}
