<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parsing Number </title>
</head>
<body>
    

    <script>

        // use promt to collect 
        let numb = prompt("Enter a number"); //returns value as string so you need to convert it to number before performing calculation

        answer = Number(numb ) + 10 ;
        alert(answer)

    </script>
</body>
</html>
