<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Javascript Object </title>
</head>
<body>

    <h1>Javascript Objects </h1>

    <script>

        const car = {
            name : "Toyota",
            brand : "camry",
            year : 2024,
            speed : 0,
            start(){
                console.log("Car Started....");
            },
            stop (){
                this.speed = 0;
                console.log('Car Stopped....');
            },
            accelerate ( ){
                this.speed += 20;
            },
            brake(){
                this.speed -= 20;
                if (this.speed < 0){
                    this.speed = 0
                }
            }

        }

        car.start();
        console.log(`Initial Speed ${car.speed} `);
        car.accelerate();
        car.accelerate();
        console.log(`Speed: ${car.speed}`);
        car.brake();
        console.log(`Break applied, Speed: ${car.speed}`);
        car.brake();
        car.brake();
        console.log(`Break applied, Speed: ${car.speed}`);
        car.stop();
        console.log(`Speed: ${car.speed}`);
